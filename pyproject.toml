[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevk5-decision-api"
version = "0.1.0"
description = "Authenticated typed-decision HTTP service for the open JevK5 model"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "huggingface-hub>=1,<2"]

[project.optional-dependencies]
gpu = ["jevk5 @ git+https://github.com/allebee/jevk5.git@v0.2.0"]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
jevk5-api = "jevk5_api.app:main"

[tool.setuptools.packages.find]
include = ["jevk5_api*"]
